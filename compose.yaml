services:
  research:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./backend/research/outputs:/app/research/outputs
    stdin_open: true
    tty: true