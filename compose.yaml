services:
  research:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    volumes:
      - ./backend/research:/app/research:ro
      - ./backend/research/outputs:/app/research/outputs
      - ./backend/data:/app/data
    stdin_open: true
    tty: true
